[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "botticelle-onelog"
version = "0.1.0"
description = "A lightweight Rich-based logging module"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [{name = "BottiCelle"}]
dependencies = ["rich>=13,<15"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/BottiCelle/onelog"
Repository = "https://github.com/BottiCelle/onelog"
Issues = "https://github.com/BottiCelle/onelog/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["onelog"]
